<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINE | Staff Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 100px auto 50px;
            padding: 2rem;
            background: #111;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        .admin-table th, .admin-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .admin-table th {
            font-family: var(--font-heading);
            color: var(--text-secondary);
        }
        .admin-img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
        }
        .admin-form {
            background: rgba(255,255,255,0.02);
            padding: 1.5rem;
            border: 1px solid var(--border-color);
            margin-bottom: 2rem;
            display: none;
        }
        .admin-form.active {
            display: block;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            color: white;
            font-family: var(--font-body);
        }
        .action-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            text-decoration: underline;
            margin-right: 10px;
        }
        .action-btn.delete { color: var(--accent); }
        
        #login-section {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-box {
            background: #111;
            padding: 3rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            width: 400px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-section">
        <div class="login-box">
            <h2 style="margin-bottom: 1rem;">STAFF LOGIN</h2>
            <form id="login-form">
                <div class="form-group">
                    <input type="text" id="username" placeholder="Username" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn" style="width: 100%;">LOGIN</button>
            </form>
            <p id="login-error" style="color: var(--accent); margin-top: 1rem; display: none;">Invalid credentials</p>
        </div>
    </div>

    <!-- ADMIN DASHBOARD -->
    <div id="dashboard-section" class="hidden">
        <nav class="navbar">
            <div class="nav-left">
                <a href="/">BACK TO STORE</a>
            </div>
            <div class="nav-center">
                <h1 class="brand-logo-small">MINE STAFF</h1>
            </div>
            <div class="nav-right">
                <a href="#" id="logout-btn">LOGOUT</a>
            </div>
        </nav>

        <div class="admin-container">
            <div class="admin-header">
                <h2>Product Catalog</h2>
                <button class="btn" id="btn-show-add-form">ADD NEW PRODUCT</button>
            </div>

            <!-- Add Product Form -->
            <div id="add-product-form" class="admin-form">
                <h3>NEW PRODUCT DETAILS</h3>
                <form id="product-form" enctype="multipart/form-data">
                    <div class="form-group">
                        <label>Product Name</label>
                        <input type="text" id="prod-name" required>
                    </div>
                    <div style="display: flex; gap: 1rem;">
                        <div class="form-group" style="flex:1;">
                            <label>Price ($)</label>
                            <input type="number" id="prod-price" required>
                        </div>
                        <div class="form-group" style="flex:1;">
                            <label>Stock</label>
                            <input type="number" id="prod-stock" required>
                        </div>
                        <div class="form-group" style="flex:1;">
                            <label>Weight (g)</label>
                            <input type="number" id="prod-weight" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Categories (comma separated, e.g. tops,new)</label>
                        <input type="text" id="prod-category" required>
                    </div>
                    <div class="form-group">
                        <label>Product Image</label>
                        <input type="file" id="prod-image" accept="image/*" required>
                    </div>
                    <button type="submit" class="btn">SAVE PRODUCT</button>
                    <button type="button" class="btn" style="background:transparent; border:1px solid white;" id="btn-cancel-add">CANCEL</button>
                </form>
            </div>

            <table class="admin-table">
                <thead>
                    <tr>
                        <th>IMG</th>
                        <th>NAME</th>
                        <th>PRICE</th>
                        <th>STOCK</th>
                        <th>CATEGORY</th>
                        <th>ACTIONS</th>
                    </tr>
                </thead>
                <tbody id="admin-product-list">
                    <!-- Loaded via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
